<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JKAM Social</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="logo">J</span><div><b>JKAM Social</b><small>Investments</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <label>Role
        <select id="role"><option>Admin</option><option>Editor</option></select>
      </label>
      <button class="link" id="reset">Reset demo data</button>
    </div>
  </aside>
  <main>
    <header id="topbar">
      <h1 id="title"></h1>
      <div class="spacer"></div>
      <button class="btn primary" id="newPost">＋ Create post</button>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<script src="src/app.js"></script>
</body>
</html>
